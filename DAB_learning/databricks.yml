bundle:
  name: DAB_learning
  uuid: 60e22c9f-95d2-4ff9-a6ae-2311324e2d43

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog_name:
    description: The catalog to use
  schema_name:
    description: The schema to use

  
targets:
  dev:
    mode: development
    default: true
    presets:
      source_linked_deployment: false
    workspace:
      host: https://dbc-a1a7be2f-6615.cloud.databricks.com
      # profile: dev
    variables:
      catalog_name: dev_catalog
      schema_name: information_schema
  
  prod:
    mode: production
    workspace:
      host: https://dbc-ac2d5ca3-9a73.cloud.databricks.com
      # profile: prod
      root_path: /Workspace/Users/dummy777mail@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: prod_catalog
      schema_name: information_schema
    permissions:
      - user_name: dummy777mail@gmail.com
        level: CAN_MANAGE
